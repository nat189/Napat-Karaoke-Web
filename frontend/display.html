<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napat Karaoke Pro — Display</title>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050505; color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #background { position: fixed; inset: 0; z-index: 0; background: #050505; }
        .bg-layer {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            opacity: 0; transition: opacity 2s ease-in-out;
        }
        .bg-layer.active { opacity: 1; }
        #background::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.78));
            pointer-events: none;
        }
        #app { position: relative; z-index: 2; width: 100%; height: 100%; }
        #top-bar {
            position: absolute; top: 22px; left: 28px; right: 28px;
            display: flex; align-items: center; justify-content: space-between; z-index: 20;
            transition: opacity 0.5s ease;
        }
        #top-bar.hidden { opacity: 0; pointer-events: none; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 45, 85, 0.9); font-size: 22px;
        }
        .brand-text strong { display: block; font-size: 20px; font-weight: 800; }
        .brand-text span { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.65); }
        .status {
            display: flex; align-items: center; gap: 9px; padding: 10px 15px;
            border-radius: 999px; background: rgba(0, 0, 0, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.1); font-size: 13px;
        }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff2d55; }
        .status-dot.online { background: #32d74b; box-shadow: 0 0 12px rgba(50, 215, 75, 0.7); }
        #player-wrapper { position: absolute; inset: 0; display: none; z-index: 5; background: #000; }
        #player { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        #now-playing {
            position: absolute; left: 28px; bottom: 28px; max-width: min(60vw, 760px);
            padding: 15px 20px; border-radius: 18px; background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(18px); z-index: 15;
            transition: opacity 0.5s ease;
        }
        #now-playing.hidden { opacity: 0; pointer-events: none; }
        .now-label { font-size: 11px; color: #ff6a00; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
        #now-title { font-size: 23px; font-weight: 800; }
        #now-channel { margin-top: 5px; font-size: 13px; color: rgba(255, 255, 255, 0.62); }
        #queue-box {
            position: absolute; left: 28px; bottom: 28px; width: 330px; max-height: 55vh;
            padding: 17px; border-radius: 22px; background: rgba(0, 0, 0, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); z-index: 15;
            transition: opacity 0.5s ease;
        }
        #queue-box.hidden { opacity: 0; pointer-events: none; }
        .queue-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .queue-title { font-size: 15px; font-weight: 800; }
        .queue-count {
            min-width: 27px; height: 27px; padding: 0 8px; border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 45, 85, 0.2); color: #ff6a00; font-size: 12px; font-weight: 800;
        }
        #queue-list { max-height: calc(55vh - 65px); overflow-y: auto; }
        .queue-item {
            display: flex; gap: 10px; align-items: center; padding: 9px;
            margin-bottom: 7px; border-radius: 13px; background: rgba(255, 255, 255, 0.055);
        }
        .queue-item.playing { background: rgba(255, 45, 85, 0.16); border: 1px solid rgba(255, 45, 85, 0.25); }
        .queue-thumb { width: 58px; height: 38px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #222; }
        .queue-info { min-width: 0; flex: 1; }
        .queue-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue-sub { margin-top: 3px; font-size: 10px; color: rgba(255, 255, 255, 0.5); }
        #qr-panel {
            position: absolute; bottom: 28px; right: 28px; width: 210px; padding: 15px;
            border-radius: 22px; background: rgba(0, 0, 0, 0.58); border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px); z-index: 18; text-align: center; transition: opacity 0.5s ease;
        }
        #qr-panel.hidden { opacity: 0; pointer-events: none; }
        #qrcode {
            width: 170px; height: 170px; margin: 0 auto 10px; padding: 8px;
            background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center;
        }
        #qrcode img { width: 100% !important; height: 100% !important; }
        .qr-title { font-size: 13px; font-weight: 800; }
        .room-code { margin-top: 5px; color: #ff6a00; font-size: 14px; font-weight: 900; }
        #start-overlay {
            position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(255, 45, 85, 0.16), rgba(0, 0, 0, 0.96) 55%);
            cursor: pointer;
        }
        .start-card {
            width: min(90vw, 480px); padding: 38px; border-radius: 28px; text-align: center;
            background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .start-button {
            padding: 14px 28px; border: 0; border-radius: 999px; background: #ff2d55;
            color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
        }
        #empty-state {
            position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
            pointer-events: none; text-align: center;
        }
        .empty-icon { font-size: 70px; }
        .empty-title { margin-top: 12px; font-size: 30px; font-weight: 900; }
    </style>
</head>
<body>
    <div id="background">
        <div class="bg-layer active" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>
    </div>

    <div id="app">
        <div id="player-wrapper"><div id="player"></div></div>

        <div id="top-bar">
            <div class="brand">
                <div class="brand-icon">🎤</div>
                <div class="brand-text"><strong>Napat Karaoke Pro</strong><span>TV Display</span></div>
            </div>
            <div class="status">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text">กำลังเริ่มระบบ...</span>
            </div>
        </div>

        <div id="qr-panel">
            <div id="qrcode"></div>
            <div class="qr-title">📱 สแกนเพื่อจองเพลง</div>
            <div id="room-code" class="room-code">-</div>
        </div>

        <div id="empty-state">
            <div>
                <div class="empty-icon">🎤</div>
                <div class="empty-title">พร้อมร้องเพลงแล้วหรือยัง?</div>
            </div>
        </div>

        <div id="now-playing" class="hidden">
            <div class="now-label">NOW PLAYING</div>
            <div id="now-title">-</div>
            <div id="now-channel">-</div>
        </div>

        <div id="queue-box">
            <div class="queue-header">
                <div class="queue-title">🎶 คิวเพลง</div>
                <div id="queue-count" class="queue-count">0</div>
            </div>
            <div id="queue-list"></div>
        </div>
    </div>

    <div id="start-overlay" onclick="initApp()">
        <div class="start-card">
            <div style="font-size: 50px; margin-bottom: 10px;">🎤</div>
            <h1>Napat Karaoke Pro</h1>
            <p style="color: #888; margin: 15px 0 25px;">แตะหน้าจอเพื่อเปิดระบบเสียงและคาราโอเกะ</p>
            <button class="start-button">▶ เริ่มใช้งาน</button>
        </div>
    </div>

    <script>
        const tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        let peer = null;
        let connections = [];
        let currentRoom = "";
        let queue = [];
        let player = null;
        let isAppReady = false;
        let isTransitioning = false;
        let songStartTime = 0;
        let currentVideoId = null;

        function initRoom() {
            const params = new URLSearchParams(window.location.search);
            currentRoom = params.get("room") || params.get("r") || sessionStorage.getItem("k_room") || "room_" + Math.random().toString(36).substring(2, 7);
            sessionStorage.setItem("k_room", currentRoom);
            document.getElementById("room-code").innerText = currentRoom;

            const qr = document.getElementById("qrcode");
            qr.innerHTML = "";
            new QRCode(qr, {
                text: `${window.location.origin}/controller.html?room=${encodeURIComponent(currentRoom)}`,
                width: 154, height: 154
            });
        }

        function initPeer() {
            try {
                peer = new Peer(currentRoom);
                peer.on("open", () => setPeerStatus("พร้อมใช้งาน", true));
                peer.on("connection", conn => {
                    connections.push(conn);
                    conn.on("open", () => syncQueue());
                    conn.on("data", data => handleCommand(data));
                    conn.on("close", () => {
                        connections = connections.filter(c => c !== conn);
                    });
                });
            } catch (e) {
                console.error(e);
            }
        }

        function setPeerStatus(text, online) {
            document.getElementById("status-text").innerText = text;
            document.getElementById("status-dot").classList.toggle("online", online);
        }

        function handleCommand(data) {
            if (!data || !data.type) return;
            if (data.type === "ADD_SONG") {
                if (!queue.some(item => item.videoId === data.song.videoId)) {
                    queue.push(data.song);
                    syncQueue();
                    if (!currentVideoId && isAppReady && !isTransitioning) playCurrent();
                }
            } else if (data.type === "SKIP") {
                skipSong();
            } else if (data.type === "DELETE_SONG") {
                if (data.index === 0) return; // ห้ามมือถือลบเพลงที่กำลังเล่น
                queue.splice(data.index, 1);
                syncQueue();
            }
        }

        function syncQueue() {
            updateQueueUI();
            connections.forEach(c => { if (c.open) c.send({ type: "QUEUE_UPDATE", queue: queue }); });
        }

        function updateQueueUI() {
            const list = document.getElementById("queue-list");
            document.getElementById("queue-count").innerText = queue.length;
            list.innerHTML = "";

            if (queue.length === 0) {
                document.getElementById("queue-box").style.display = "none";
                document.getElementById("now-playing").classList.add("hidden");
                document.getElementById("empty-state").style.display = "flex";
                return;
            }

            document.getElementById("queue-box").style.display = "block";
            document.getElementById("empty-state").style.display = "none";

            document.getElementById("now-title").innerText = queue[0].title;
            document.getElementById("now-channel").innerText = queue[0].channel;

            queue.forEach((song, idx) => {
                const item = document.createElement("div");
                item.className = "queue-item" + (idx === 0 ? " playing" : "");
                item.innerHTML = `
                    <img class="queue-thumb" src="${song.thumbnail}">
                    <div class="queue-info">
                        <div class="queue-name">${song.title}</div>
                        <div class="queue-sub">${song.channel}</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function playCurrent() {
            if (queue.length === 0) {
                showIdle();
                return;
            }

            const current = queue[0];
            if (currentVideoId === current.videoId) return;
            currentVideoId = current.videoId;
            songStartTime = Date.now(); // บันทึกเวลาเริ่มเพลง

            document.getElementById("player-wrapper").style.display = "block";
            document.getElementById("empty-state").style.display = "none";
            document.getElementById("now-playing").classList.remove("hidden");

            if (player && typeof player.loadVideoById === "function") {
                player.loadVideoById({
                    videoId: current.videoId
                });
            }
            updateQueueUI();
        }

        function skipSong() {
            isTransitioning = true;
            currentVideoId = null;
            queue.shift();
            syncQueue();
            if (queue.length > 0) playCurrent();
            else showIdle();
            setTimeout(() => { isTransitioning = false; }, 1000);
        }

        function showIdle() {
            currentVideoId = null;
            if (player && typeof player.stopVideo === "function") player.stopVideo();
            document.getElementById("player-wrapper").style.display = "none";
            document.getElementById("empty-state").style.display = "flex";
            document.getElementById("now-playing").classList.add("hidden");
            document.getElementById("queue-box").style.display = "none";
            updateQueueUI();
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player("player", {
                width: "100%", height: "100%",
                playerVars: {
                    autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1
                },
                events: {
                    onReady: () => { if (isAppReady && queue.length > 0) playCurrent(); },
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // ล็อกเด็ดขาด: เพลงต้องเริ่มไปเกิน 8 วินาทีเท่านั้น ถึงจะยอมรับว่าเพลงจบ (ENDED = 0)
            if (event.data === YT.PlayerState.ENDED) {
                const playedSeconds = (Date.now() - songStartTime) / 1000;
                if (playedSeconds > 8) {
                    skipSong();
                } else {
                    console.log("ป้องกันบั๊กตัดจบ 1 วินาที: บังคับเล่นต่อ");
                    if (player) player.playVideo();
                }
            }
        }

        function initApp() {
            isAppReady = true;
            document.getElementById("start-overlay").style.display = "none";
            initRoom();
            initPeer();
            if (player && queue.length > 0) playCurrent();
        }
    </script>
</body>
</html>
